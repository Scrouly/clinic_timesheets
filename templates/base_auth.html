{% load static %}<!doctype html>
<html lang="ru">
<head>
  {% include "partials/_head.html" %}
  <title>{% block title %}{{ APP_TITLE }}{% endblock %}</title>
</head>
<body class="auth">
  <main class="auth__box" id="main">
    <div class="auth__brand">
      <img class="auth__logo" src="{% static 'img/brand/logo.svg' %}" alt="CityClinic" width="185" height="38">
      <p class="auth__title">{{ APP_TITLE }}{% if ORG_NAME %}<span class="auth__org">{{ ORG_NAME }}</span>{% endif %}</p>
    </div>
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
