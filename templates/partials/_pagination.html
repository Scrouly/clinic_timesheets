{# Постраничный вывод: {% include "partials/_pagination.html" with page_obj=page_obj %} #}
{% if page_obj.has_other_pages %}
  <nav class="pager" aria-label="Страницы">
    {% if page_obj.has_previous %}<a class="btn" href="?page={{ page_obj.previous_page_number }}">Назад</a>{% endif %}
    <span class="pager__info">Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="btn" href="?page={{ page_obj.next_page_number }}">Вперёд</a>{% endif %}
  </nav>
{% endif %}
