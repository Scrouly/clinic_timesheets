{# Поле формы: {% include "partials/_field.html" with field=form.username %} #}
<div class="field{% if field.errors %} field--invalid{% endif %}">
  <label class="field__label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<p class="field__help">{{ field.help_text|safe }}</p>{% endif %}
  {% for error in field.errors %}<p class="field__error">{{ error }}</p>{% endfor %}
</div>
